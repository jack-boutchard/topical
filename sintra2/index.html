const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const kb=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},
    kb,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(buf);
}
const m=document.getElementById("m"),go=document.getElementById("go");
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  go.disabled=true; m.className="msg busy"; m.textContent="Decrypting\u2026";
  try{
    const html=await decrypt(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  }catch(err){
    m.className="msg"; m.textContent="Incorrect passphrase.";
    document.getElementById("pw").value=""; go.disabled=false;
  }
});
